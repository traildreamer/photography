<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimmy Peterson | Fine Art Bird Photography</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/css/glightbox.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@200;400&display=swap');
        
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1a1a1a; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }

        /* NAVIGERING */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 60px;
            position: absolute;
            width: 100%;
            z-index: 100;
            color: white;
        }
        .logo-box { line-height: 1.1; }
        .logo-name { font-size: 1.6rem; letter-spacing: 3px; font-weight: 200; text-transform: uppercase; }
        .logo-tag { font-size: 0.65rem; letter-spacing: 5px; text-transform: uppercase; opacity: 0.7; margin-top: 5px; }

        .menu { display: flex; gap: 40px; list-style: none; margin: 0; padding: 0; }
        .menu-item a { 
            color: white; 
            text-decoration: none; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            transition: opacity 0.3s;
            font-weight: 400;
        }
        .menu-item a:hover { opacity: 0.5; }

        /* HERO */
        .hero {
            height: 90vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .hero img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .hero-title { position: relative; z-index: 2; text-align: center; color: white; }
        .hero-title h1 { font-size: clamp(3.5rem, 10vw, 7.5rem); margin: 0; font-weight: 400; font-style: italic; letter-spacing: -2px; }

        /* GALLERI (MASONRY - Ingen ihoptryckning) */
        .portfolio-section {
            max-width: 1600px;
            margin: 100px auto;
            padding: 0 40px;
        }
        .portfolio-masonry {
            column-count: 3;
            column-gap: 30px;
        }
        @media (max-width: 1100px) { .portfolio-masonry { column-count: 2; } }
        @media (max-width: 700px) { .portfolio-masonry { column-count: 1; } .nav { padding: 30px; } }

        .img-box { 
            display: inline-block;
            width: 100%;
            margin-bottom: 30px;
            overflow: hidden;
            background: #fdfdfd;
        }
        .img-box img { 
            width: 100%; 
            height: auto; 
            display: block; 
            transition: transform 1s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .img-box:hover img { transform: scale(1.04); }

        /* INFO SEKTIONER */
        .info-section {
            padding: 120px 20px;
            text-align: center;
            border-top: 1px solid #f0f0f0;
        }
        .info-section h2 { font-size: 3rem; font-weight: 400; margin-bottom: 40px; }
        .contact-details { font-size: 1.4rem; font-weight: 200; line-height: 2; }
        .contact-details a { color: inherit; text-decoration: none; border-bottom: 1px solid #ddd; }
        
        .social-grid {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 30px;
        }
        .social-link {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #1a1a1a;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid #eee;
            transition: all 0.4s;
        }
        .social-link:hover { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

        footer { 
            padding: 60px 20px; 
            text-align: center; 
            font-size: 0.65rem; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            color: #aaa;
        }
    </style>
</head>
