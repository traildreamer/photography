<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimmy Peterson | Fine Art Bird Photography</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/css/glightbox.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@300;400&display=swap');
        
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #111; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }

        /* NAVIGERING */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            position: absolute;
            width: 100%;
            z-index: 100;
            color: white;
        }
        .logo-box { line-height: 1.2; }
        .logo-name { font-size: 1.5rem; letter-spacing: 2px; font-weight: 400; }
        .logo-tag { font-size: 0.7rem; letter-spacing: 4px; text-transform: uppercase; opacity: 0.8; }

        .menu { display: flex; gap: 30px; list-style: none; margin: 0; padding: 0; }
        .menu-item a { 
            color: white; 
            text-decoration: none; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            transition: opacity 0.3s;
        }
        .menu-item a:hover { opacity: 0.6; }

        /* HERO */
        .hero {
            height: 85vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .hero img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        .hero-title { position: relative; z-index: 2; text-align: center; color: white; }
        .hero-title h1 { font-size: clamp(3rem, 8vw, 6rem); margin: 0; font-weight: 400; font-style: italic; }

        /* NATURLIG GRID (Ingen ihoptryckning) */
        .portfolio {
            max-width: 1400px;
            margin: 60px auto;
            padding: 0 20px;
            /* Kolumner som anpassar sig efter bildens naturliga höjd */
            column-count: 3;
            column-gap: 20px;
        }

        @media (max-width: 1024px) { .portfolio { column-count: 2; } }
        @media (max-width: 768px) { .portfolio { column-count: 1; } }

        .img-box { 
            display: inline-block; /* Viktigt för masonry-effekt */
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden; 
            background: #f9f9f9;
        }
        
        .img-box img { 
            width: 100%; 
            height: auto; /* Behåller proportioner */
            display: block; 
            transition: transform 0.8s ease; 
        }
        .img-box:hover img { transform: scale(1.03); }

        /* KONTAKT & SOCIALA SEKTION */
        .contact-section { 
            padding: 100px 20px; 
            text-align: center; 
            background-color: #f9f9f9;
            border-top: 1px solid #eee;
        }
        .contact-info { margin-bottom: 50px; }
        .social-links { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
        .social-links a { 
            color: #111; 
            text-decoration: none; 
            font-size: 1.1rem; 
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }

        footer { padding: 40px 20px; text-align: center; font-size: 0.7rem; letter-spacing: 3px; opacity: 0.5; text-transform: uppercase; }
    </style>
</head>
