    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/css/glightbox.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:ital@0;1&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #111; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }
        
        /* Galleri-inställningar */
        .img-wrapper { 
            background-color: #f3f3f3; 
            overflow: hidden; 
            position: relative; 
            max-height: 85vh; 
            margin-bottom: 4rem; 
        }
        img.gallery-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }

        /* HERO - Nu med direkt bildreferens */
        .hero-section {
            position: relative;
            height: 80vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #000;
        }
        .hero-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6; /* Gör bilden mörkare så texten syns */
        }
        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
        }
    </style>
</head>
