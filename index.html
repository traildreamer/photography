<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">

    <title>Jimmy Peterson | Fine Art Fågelfotografi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/css/glightbox.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Questrial&display=swap');
        
        /* Grundinställningar */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Questrial', sans-serif; 
            background-color: #ffffff; 
            color: #1a1a1a; 
            margin: 0; 
            line-height: 1.6;
        }
        .serif { font-family: 'Playfair Display', serif; }

        /* HERO SEKTION */
        .hero {
            position: relative;
            height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
            text-align: center;
            color: white;
        }
        .hero img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }
        .hero-content { position: relative; z-index: 2; padding: 20px; }
        .hero h1 { font-size: clamp(3rem, 10vw, 7rem); margin: 0; font-weight: 400; font-style: italic; }
        .hero p { letter-spacing: 0.5em; text-transform: uppercase; font-size: 0.8rem; margin-top: 20px; opacity: 0.8; }

        /* GRID SYSTEM - Här tvingar vi fram 3 kolumner */
        .portfolio-container {
            max-width: 1400px;
            margin: 80px auto;
            padding: 0 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 kolumner på dator */
            gap: 20px;
        }
        @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } } /* 2 på surfplatta */
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } } /* 1 på mobil */

        /* BILD-WRAPPERS */
        .img-wrapper {
            position: relative;
            background: #f7f7f7;
            aspect-ratio: 1 / 1; /* Gör alla bilder kvadratiska i griden för lugn layout */
            overflow: hidden;
        }
        /* Specialstorlekar för att göra det intressant */
        .wide { grid-column: span 2; aspect-ratio: 16 / 9; } 
        
        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
            display: block;
        }
        .img-wrapper:hover img { transform: scale(1.05); }

        /* KONTAKT */
        footer {
            padding: 100px 20px;
            text-align: center;
            border-t: 1px solid #eee;
        }
        footer a { 
            font-size: clamp(1.5rem, 5vw, 3rem); 
            color: #000; 
            text-decoration: none; 
            border-bottom: 1px solid #ccc;
        }
    </style>
</head>
