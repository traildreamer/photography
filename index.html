<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimmy Peterson Photography</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&display=swap');
        body { background-color: #ffffff; color: #111; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }
        /* Vi sätter en fast höjd på behållarna för att förhindra "layout shift" */
        .img-container {
            background-color: #f3f3f3;
            margin-bottom: 2rem;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            /* Tvingar webbläsaren att inte vänta på hela filen innan den börjar visa pixlar */
            image-rendering: auto;
        }
    </style>
</head>
<body>

    <header class="py-20 text-center">
        <h1 class="serif text-5xl italic">Jimmy Peterson</h1>
        <p class="tracking-[0.5em] text-[10px] mt-4 opacity-50 uppercase">Photography</p>
    </header>

    <main class="max-w-[1000px] mx-auto px-6">
        <div class="img-container"><img src="_D7A4815.JPG" fetchpriority="high"></div>
        <div class="img-container"><img src="_D7A1088.JPG" fetchpriority="high"></div>
        <div class="img-container"><img src="_D7A6184.JPG" fetchpriority="high"></div>
        
        <div class="img-container"><img src="_D7A2060.JPG"></div>
        <div class="img-container"><img src="_D7A2180.JPG"></div>
        <div class="img-container"><img src="_D7A3296-Enhanced-NR.JPG"></div>
        <div class="img-container"><img src="_D7A5721.JPG"></div>
        <div class="img-container"><img src="_D7A5736.JPG"></div>
        <div class="img-container"><img src="_D7A2184.JPG"></div>
        <div class="img-container"><img src="_D7A5405.JPG"></div>
        <div class="img-container"><img src="_D7A5601.JPG"></div>
        <div class="img-container"><img src="_D7A5951.JPG"></div>
        <div class="img-container"><img src="_D7A9548.JPG"></div>
    </main>

    <footer class="py-24 text-center border-t border-gray-100">
        <p class="serif text-2xl italic mb-4">Kontakt</p>
        <a href="mailto:jimmy@jimmypeterson.se" class="text-xl border-b border-black">jimmy@jimmypeterson.se</a>
        <p class="mt-4 text-gray-500">+46-76-882 94 82</p>
    </footer>

</body>
</html>
