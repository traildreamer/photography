<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimmy Peterson Photography</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/css/glightbox.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:ital@0;1&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfdfd; color: #1a1a1a; }
        .serif { font-family: 'Playfair Display', serif; }
        
        /* Begränsar höjden på bilderna i galleriet för bättre överblick */
        .img-wrapper {
            position: relative;
            overflow: hidden;
            background-color: #f0f0f0;
            max-height: 70vh; /* Bilden blir aldrig högre än 70% av skärmen */
        }
        
        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }

        .img-wrapper:hover img {
            transform: scale(1.02);
        }

        /* Fixar så att lightboxen inte visar gigantiska bilder direkt */
        .gslide-image img {
            max-height: 90vh !important;
            width: auto !important;
        }
    </style>
</head>
<body>

    <header class="py-20 text-center">
        <h1 class="serif text-5xl md:text-7xl italic tracking-tight">Jimmy Peterson</h1>
        <p class="uppercase tracking-[0.5em] text-[10px] mt-4 opacity-60">Photography</p>
