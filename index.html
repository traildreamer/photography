    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/css/glightbox.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Questrial&display=swap');
        body { font-family: 'Questrial', sans-serif; background-color: #f8f8f8; color: #1a1a1a; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }
        
        /* Galleri-optimering */
        .img-wrapper { background-color: #eee; overflow: hidden; position: relative; margin-bottom: 2rem; }
        img.gallery-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: all 1.2s cubic-bezier(0.2, 1, 0.3, 1); }
        
        /* Hovringseffekt */
        .img-wrapper:hover img.gallery-img { transform: scale(1.05); filter: brightness(1.05); }

        /* Mjuk laddning av sidan */
        body { opacity: 0; animation: fadeIn 1.5s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
