<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimmy Peterson Photography</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/css/glightbox.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:ital@0;1&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfdfd; color: #1a1a1a; }
        .serif { font-family: 'Playfair Display', serif; }
        
        /* OPTIMERING: Förhindrar att sidan hoppar och sparar minne */
        .img-wrapper {
            position: relative;
            overflow: hidden;
            background-color: #f0f0f0;
            max-height: 80vh;
            content-visibility: auto; /* Optimerar rendering för långa sidor */
        }
        
        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Förhindrar att tunga bilder segar ner scrollningen */
            will-change: transform; 
        }

        /* Begränsar bildens storlek i fullskärmsläge så webbläsaren inte dör */
        .gslide-image img {
            max-height: 95vh !important;
            width: auto !important;
            image-rendering: -webkit-optimize-contrast;
        }
    </style>
</head>
<body>

    <header class="py-16 text-center">
        <h1 class="serif text-5xl md:text-6xl italic tracking-tight">Jimmy Peterson</h1>
        <p class="uppercase tracking-[0.5em] text-[10px] mt-4 opacity-60">Photography</p>
    </header>

    <main class="max-w-[1200px] mx-auto px-6 pb-24">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            
            <div class="img-wrapper aspect-[4/5]">
                <a href="_D7A4815.JPG?v=2" class="glightbox"><img src="_D7A4815.JPG?v=2" decoding="async"></a>
            </div>

            <div class="img-wrapper aspect-square">
                <a href="_D7A1088.JPG?v=2" class="glightbox"><img src="_D7A1088.JPG?v=2" decoding="async"></a>
            </div>

            <div class="img-wrapper aspect-video md:col-span-2">
                <a href="_D7A6184.JPG?v=2" class="glightbox"><img src="_D7A6184.JPG?v=2" loading="lazy" decoding="async"></a>
            </div>

            <div class="img-wrapper aspect-square">
                <a href="_D7A2060.JPG?v=2" class="glightbox"><img src="_D7A2060.JPG?v=2" loading="lazy" decoding="async"></a>
            </div>

            <div class="img-wrapper aspect-square">

            </div>

            <div class="img-wrapper aspect-[3/4]">
                <a href="_D7A5736.JPG?v=2" class="glightbox"><img src="_D7A5736.JPG?v=2" loading="lazy" decoding="async"></a>
            </div>

            <div class="img-wrapper aspect-square">
                <a href="_D7A2184.JPG?v=2" class="glightbox"><img src="_D7A2184.JPG?v=2" loading="lazy" decoding="async"></a>
            </div>

            <div class="img-wrapper aspect-square">
                <a href="_D7A5405.JPG?v=2" class="glightbox"><img src="_D7A5405.JPG?v=2" loading="lazy" decoding="async"></a>
            </div>

            <div class="img-wrapper aspect-square">
                <a href="_D7A5601.JPG?v=2" class="glightbox"><img src="_D7A5601.JPG?v=2" loading="lazy" decoding="async"></a>
            </div>

            <div class="img-wrapper aspect-square">
                <a href="_D7A5951.JPG?v=2" class="glightbox"><img src="_D7A5951.JPG?v=2" loading="lazy" decoding="async"></a>

    <footer id="contact" class="bg-white border-t border-zinc-100 py-24 text-center">

        <a href="mailto:jimmy@jimmypeterson.se" class="text-xl font-light hover:opacity-60 transition italic">jimmy@jimmypeterson.se</a>
        <p class="text-zinc-400 text-sm mt-4">+46 76-882 94 82</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>
    <script>
        const lightbox = GLightbox({ 
            selector: '.glightbox',
            touchNavigation: true,
            loop: true,
            preload: false // Förhindrar att lightboxen laddar alla bilder i förväg
        });
    </script>
</body>
</html>
