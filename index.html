        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #111; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }
        
        /* Galleri-inställningar */
        .img-wrapper { 
            background-color: #f9f9f9; 
            overflow: hidden; 
            position: relative; 
            max-height: 80vh; 
            margin-bottom: 3rem; 
        }
        img.gallery-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }

        /* Hero/Toppsektion med bakgrundsbild */
        .hero-bg {
            /* Vi använder en av dina bilder som bakgrund, t.ex. en stämningsfull en */
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('_D7A5721 (1).jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Ger en subtil parallax-effekt på dator */
        }
    </style>
</head>
