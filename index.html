<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimmy Peterson | Fine Art Bird Photography</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/css/glightbox.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@300;400&display=swap');
        
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #111; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }

        /* NAVIGERING */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            position: absolute;
            width: 100%;
            z-index: 100;
            color: white;
        }
        .logo-box { line-height: 1.2; }
        .logo-name { font-size: 1.5rem; letter-spacing: 2px; font-weight: 400; }
        .logo-tag { font-size: 0.7rem; letter-spacing: 4px; text-transform: uppercase; opacity: 0.8; }

        .menu { display: flex; gap: 30px; list-style: none; margin: 0; padding: 0; }
        .menu-item { position: relative; cursor: pointer; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; }
        
        /* Dropdown-menyer */
        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            color: black;
            padding: 20px;
            min-width: 250px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-top: 10px;
            text-transform: none;
            letter-spacing: 0;
        }
        .menu-item:hover .dropdown { display: block; }
        .dropdown a { color: #111; text-decoration: none; display: block; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .dropdown a:hover { opacity: 0.6; }

        /* HERO */
        .hero {
            height: 85vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .hero img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        .hero-title { position: relative; z-index: 2; text-align: center; color: white; }
        .hero-title h1 { font-size: clamp(3rem, 8vw, 6rem); margin: 0; font-weight: 400; font-style: italic; }

        /* GRID */
        .portfolio {
            max-width: 1400px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        @media (max-width: 1024px) { .portfolio { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .portfolio { grid-template-columns: 1fr; } }

        .img-box { position: relative; overflow: hidden; aspect-ratio: 1/1; background: #f9f9f9; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; display: block; }
        .img-box:hover img { transform: scale(1.05); }

        footer { padding: 80px 20px; text-align: center; border-top: 1px solid #eee; font-size: 0.7rem; letter-spacing: 3px; opacity: 0.5; text-transform: uppercase; }
    </style>
</head>
